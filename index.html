<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="dark-mode">

                <img src="IMG/icono.JPG" alt="Logo" class="brand-logo">

            <nav class="main-nav">

    <main id="app-container">
        </main>
